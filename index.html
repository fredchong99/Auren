tial."},{type:"AI CHAT",duration:"10 min",title:"Recommended next path",detail:"AUREN suggests what to learn next. Not a sales pitch — a learning plan."}]}],w=42,N="38–46",j="Foundation Learner",S="Aisha Tan",C=[{label:"Investor Reasoning",value:35,max:100,color:g,tier:"weak"},{label:"AI Literacy",value:28,max:100,color:g,tier:"weak"},{label:"Risk Awareness",value:45,max:100,color:b,tier:"moderate"},{label:"Scam Resistance",value:30,max:100,color:g,tier:"weak"},{label:"Behavioral Stability",value:45,max:100,color:b,tier:"moderate"}],E="The learner demonstrates surface-level confidence in capital-market exposure — having held some ETFs and individual stocks — but lacks the structured reasoning framework needed to navigate AI-influenced markets. Decision-making is socially mediated (peer and social-media driven) rather than evidence-led. Loss aversion is pronounced: emotional response under simulated market stress is high. AI literacy is the most underdeveloped dimension: the learner currently treats AI outputs as authoritative without source verification, hallucination awareness, or escalation logic. Scam resistance is weak — vulnerable to deepfake and social-engineering vectors common on social media. The learner shows positive engagement signals (curiosity, honesty in self-disclosure), making the prognosis for the 3-day adaptive course strong.",A=["Honest and reflective in self-disclosure — strong foundation for adaptive learning","Has practical exposure (ETFs, individual stocks) to anchor abstract concepts","Curious about AI rather than defensive — open to literacy training","Maintains conversational engagement without defensiveness under questioning"],P=["Build structured decision frameworks (e.g., written investment thesis before action)","Develop AI source-verification workflow — never act on a single AI response","Strengthen scam detection: train pattern recognition on deepfakes and social-media fraud","Address loss aversion through behavioral discipline modul
