I persona · simulated · safe rehearsal",personaName:'"Marcus"',personaRole:"Private Trading Group",watching:"AUREN · watching",improvement:"Improvement",feedback:"Feedback",scTitle:"Evidential scorecard",scOwnWords:"Your own words, scored.",before:"before",now:"now",session:"this session",exchange:"Exchange",evidenceQuote:"“They are shown their own words... The evidence is the transcript. Nothing is asserted that cannot be pointed to.” — Full Project Paper §13",regSees:"What the regulator sees",regBody:e=>`One anonymized data point: cohort MY \xb7 \u{201C}WhatsApp recruitment\u{201D} \xb7 ${e}. At population scale: \u{201C}an early-warning sensor network for emerging fraud.\u{201D} No personal data leaves the session.`,regPassed:"passed",regFailed:"failed at urgency stage",regCoached:"coached mid-session",rehearseAgain:"Rehearse again ↻",restart:"Restart session",toMarcus:"→ Marcus",you:"You",voiceOn:"Voice on",voiceOff:"Voice off"},verdict:{certified:{label:"CERTIFIED",note:"Verification protocol demonstrated under pressure. The next rehearsal in your path unlocks."},review:{label:"NEEDS REVIEW",note:"Mixed signals. AUREN recommends one repeat with variations before certification."},retrain:{label:"RETRAIN REQUIRED",note:"AUREN will re-run this scenario with variations — you cannot pass by memorizing a script."}},greeting:"Hello — I'm AUREN, your investor readiness mentor. This is a live session: you talk, I listen. First — what should I call you?",greetingAgain:"Hello again — I'm AUREN. Let's run it once more. What should I call you this time?",qs:[e=>`Nice to meet you, ${e}. Let's talk \u{2014} three questions, no wrong answers. First: have you invested before? Tell me in your own words.`,()=>"And when you decide what to buy — what actually guides you? Friends, feeds, AI tools, your own research… tell me honestly.",()=>"Last one. Imagine the market drops twenty percent in a week and the headlines are screaming. What's your first instinct — what do you actually do?"],interviewDone:e=>`That's all I need, ${e}. I'm putting your starting picture together \u{2014} say "ready" when you want to see it.`,ailsLine:(e,t,n)=>`There it is, ${e} \u{2014} your Investor Readiness Score starts at ${t}. Not a verdict, a starting point. Most exposed: ${n}. So no lecture \u{2014} next, you'll take a call with "Marcus", a real recruitment pattern played by an AI persona, completely safe. Treat it as real. Say "ready".`,weakestNone:"honestly, none — a strong start",watchToast:"I'm right here in the corner. Reply to him exactly as you would in real life — if I see a risky pattern, my note will appear like this.",watchToastAgain:e=>`Again, ${e} \u{2014} same recruiter, varied moves. Reply as yourself.`,postCoachNext:"He's typing again — watch the next move.",postExcellent:"That question is the strongest filter you have. Watch — he'll dodge it.",postGood:"Noted. Keep going — the pressure is about to increase.",closing:(e,t)=>`That's the scenario, ${e}. Every word you typed is now evidence \u{2014} ${t?"and your instincts held better than most first-timers.":"and this is exactly why we rehearse here, not with your savings."} Here is your scorecard.`,marcus:["Hey! Adam gave me your number 😊 He said you might be interested in our private trading group. We're up 40% this quarter using AI signals — limited spots left!","Here's proof 📈 [screenshot: +RM12,400 this month]. Adam's already in. Everyone in the group is making money. You in?","Spots close TONIGHT ⏰ Minimum RM2,000 to start. I'll send you the deposit link — takes 2 minutes. Don't miss out like last time!"],reacts:{pre:(e,t)=>`"${t}" \u{2014} that's actually a good place to start, ${e}. No bad habits to unlearn.`,trader:(e,t)=>`"${t}" \u{2014} experienced, then. I'll be watching for overconfidence as much as gaps.`,selfTaught:(e,t)=>`"${t}" \u{2014} good, some real exposure to anchor on. Not a test, remember. Next question.`,aiTrust:(e,t)=>`"${t}" \u{2014} thank you for the honesty, ${e}. That trust in AI answers is exactly what we'll rehearse \u{2014} confidence is not accuracy.`,social:(e,t)=>`"${t}" \u{2014} noted. Decisions that travel through friends and feeds are exactly where AI-era scams enter. We'll train for that.`,evidence:(e,t)=>`"${t}" \u{2014} evidence-led. Good. The question is whether that discipline survives pressure. We'll find out.`,mixed:(e,t)=>`"${t}" \u{2014} understood. I'm hearing instinct more than method. That's trainable.`,sell:(e,t)=>`"${t}" \u{2014} honest. That instinct to sell into fear is loss aversion, and most people share it. Knowing it is step one; rehearsing it is step two.`,plan:(e,t)=>`"${t}" \u{2014} plan first, action second. That's the strongest possible answer. Let's see if it holds when the pressure is personal.`,dip:(e,t)=>`"${t}" \u{2014} buying fear can be right, but I didn't hear a risk frame around it. We'll work on that.`,unclear:(e,t)=>`"${t}" \u{2014} alright. Your real answer will show up in rehearsal, not in words. Which is exactly why we rehearse.`},obs:{pre:"Pre-investor. High teachability window — habits not yet formed.",trader:"Active trader. Overconfidence risk flagged for rehearsal path.",selfTaught:"Self-taught experience. Tactical exposure, no strategic framework detected yet.",aiTrust:"Uncritical AI trust. AI-tool literacy is the priority dimension.",social:"Socially mediated decisions. Low independent verification. Scam-vector exposure risk.",evidence:"Evidence-led reasoning present. Verify depth under pressure.",mixed:"Mixed decision inputs. Verification workflow not yet structured.",sell:"Pronounced loss aversion. Emotional response under simulated stress is high.",plan:"Plan-based discipline signal. Strongest volatility response.",dip:"Contrarian instinct without stated risk frame. Conviction unverified.",unclear:"Volatility response unclear — emotional pattern to be observed in rehearsal."},sig:{vuln:"Scam-vulnerability signal",cert:"Certification signal",verif:"Verification signal",neutral:"Neutral engagement",trust:"Trust-transfer bias",socialProof:"Social-proof capitulation",urgency:"Urgency capitulation",resist:"Pressure resistance",resistPart:"Pressure resistance — partial"},ana:{vuln0:"Immediate agreement without verification — the exact pattern recruitment scams rely on.",cert0:"Registry-first response before any engagement — the single most effective scam filter available to a retail investor.",verif0:"Skepticism before engagement — identity or return-claim challenged. Correct first move.",neutral0:"No commitment made — but no verification question asked yet either. The registry question is the strongest move here.",trust1:"“Recruiter-driven scams specifically exploit trusted contacts — the friend sharing the scheme is often themselves a victim being used as a distribution channel.”",social1:"A fabricated screenshot plus 'everyone is in' was enough to move you. Profit screenshots are not evidence.",cert1:"Direct registry challenge under social proof — the exact behavior AUREN certifies.",verif1:"Evidence skepticism under social pressure. The verification instinct is engaging.",urgency2:"Funds committed inside an artificial deadline with zero verification steps completed. In the real event this money is unrecoverable.",cert2:"“Verification protocol correctly applied... the certification criterion for this scenario is met.”",resist2:"Broke the urgency lever — refused to act inside the countdown. One step remains: independent verification through official channels.",resistPart2:"No capitulation under deadline — but the exit line wasn't explicit. The certified close is: verify offline before anything moves."},coach:{c0:"Pause. You just agreed before verifying anything. Before responding to any investment invitation, ask: who is this person — and can the claim be verified?",cTrust:"Careful — that's trust-transfer. Adam's sincerity is real, and irrelevant. He may himself be a victim. Verify the platform, not the friend.",cSocial:"That screenshot took thirty seconds to fabricate. Social proof is a pressure lever, not evidence. Ask for something verifiable — a regulator registration.",cUrgency:"Stop. In a live event, this is the moment the money leaves. Urgency is manufactured — legitimate investments do not expire tonight. Rehearse the exit line until it's automatic: 'I verify offline before I move anything.'"},chips:{name:["Fred","Aisha"],q0:["A few ETFs and stocks, nothing structured","Never — but I want to start","I trade crypto actively"],q1:["Mostly friends and what's trending on TikTok","I ask ChatGPT and usually just go with it","My own research — filings and fees"],q2:["Honestly? I'd sell to stop the bleeding","I'd check my written plan before doing anything","Buy the dip"],r0:["Sure, how do I sign up?","Who are you? How do you know Adam?","Is this platform registered with the regulator?"],r1:["I trust Adam — he wouldn't send a scam","Screenshots can be faked. Show me a license.","What's the regulator registration number?"],r2:["OK send me the link, I'll do it now","I'm not deciding inside your countdown","I'll verify this offline before I do anything"],ready:["I'm ready","Let's do it"]}},ms:{ttsLang:"ms-MY",dims:{IR:"Penaakulan Pelabur",AL:"Literasi AI",RA:"Kesedaran Risiko",SR:"Ketahanan Penipuan",BS:"Kestabilan Tingkah Laku"},ui:{liveSession:"sesi langsung",notAdvice:"Bukan nasihat",speaking:"AUREN · bercakap",listening:"AUREN · mendengar",tapToSkip:"tekan untuk langkau",send:"Hantar",orTry:"atau cuba:",observed:"diperhati",introTitle:"Satu sesi langsung: temu bual → profil kesediaan (AIRS) → latihan main peranan → kad skor berbukti.",introSub:"Dia kekal terapung di atas — perbualan bergerak di sini, di bawahnya.",phName:"Beritahu AUREN nama anda…",phAnswer:"Jawab AUREN dengan kata-kata anda sendiri…",phReady:'Sebut "sedia" apabila anda bersedia…',phMarcus:"Balas kepada Marcus…",phDone:"Sesi selesai — mula semula di bawah",phAurenSpeaking:"AUREN sedang bercakap…",phMarcusSpeaking:"Marcus sedang ber nama anda kali ini?",qs:[e=>`Selamat berkenalan, ${e}. Tiga soalan sahaja \u{2014} tiada jawapan salah. Pertama: pernahkah anda melabur? Ceritakan dengan kata-kata anda sendiri.`,()=>"Apabila anda memilih pelaburan — apakah yang sebenarnya menjadi panduan anda? Kawan-kawan, media sosial, alat AI, kajian sendiri… jawab dengan jujur.",()=>"Soalan terakhir. Bayangkan pasaran jatuh dua puluh peratus dalam seminggu dan semua berita panik. Apakah naluri pertama anda — apa yang anda benar-benar buat?"],interviewDone:e=>`Itu sahaja yang saya perlukan, ${e}. Saya sedang menyusun gambaran permulaan anda \u{2014} sebut "sedia" apabila anda mahu melihatnya.`,ailsLine:(e,t,n)=>`Ini dia, ${e} \u{2014} Skor Kesediaan Pelabur anda bermula pada ${t}. Bukan hukuman, hanya titik permulaan. Paling terdedah: ${n}. Jadi tiada syarahan \u{2014} seterusnya, anda akan menerima panggilan daripada "Marcus", corak rekrutmen sebenar yang dimainkan oleh persona AI, selamat sepenuhnya. Anggap ia benar. Sebut "sedia".`,weakestNone:"sejujurnya, tiada — permulaan yang kukuh",watchToast:"Saya di sini, di penjuru, memerhati. Balas kepadanya seperti dalam kehidupan sebenar — jika saya nampak corak berisiko, nota saya akan muncul seperti ini.",watchToastAgain:e=>`Sekali lagi, ${e} \u{2014} perekrut yang sama, taktik berbeza. Balas sebagai diri anda sendiri.`,postCoachNext:"Dia sedang menaip lagi — perhatikan langkah seterusnya.",postExcellent:"Soalan itu penapis paling kuat yang anda ada. Perhatikan — dia akan mengelak.",postGood:"Baik. Teruskan — tekanan akan meningkat.",closing:(e,t)=>`Itulah senarionya, ${e}. Setiap perkataan yang anda taip kini menjadi bukti \u{2014} ${t?"dan naluri anda bertahan lebih baik daripada kebanyakan orang kali pertama.":"dan inilah sebabnya kita berlatih di sini, bukan dengan simpanan anda."} Ini kad skor anda.`,marcus:["Hei! Adam bagi nombor awak 😊 Katanya awak mungkin berminat dengan kumpulan trading privet kami. Kami untung 40% suku ini guna isyarat AI — slot terhad!","Ini buktinya 📈 [tangkapan skrin: +RM12,400 bulan ini]. Adam dah masuk. Semua ahli untung. Awak nak join?","Slot tutup MALAM INI ⏰ Minimum RM2,000 untuk mula. Saya hantar link deposit — 2 minit je. Jangan terlepas macam dulu!"],reacts:{pre:(e,t)=>`"${t}" \u{2014} itu sebenarnya titik permulaan yang baik, ${e}. Tiada tabiat buruk untuk dibuang.`,trader:(e,t)=>`"${t}" \u{2014} berpengalaman rupanya. Saya akan perhatikan keyakinan berlebihan sama seperti kelemahan.`,selfTaught:(e,t)=>`"${t}" \u{2014} bagus, ada pengalaman sebenar sebagai asas. Ingat, ini bukan ujian. Soalan seterusnya.`,aiTrust:(e,t)=>`"${t}" \u{2014} terima kasih atas kejujuran anda, ${e}. Kepercayaan kepada jawapan AI itulah yang akan kita latih \u{2014} keyakinan bukan ketepatan.`,social:(e,t)=>`"${t}" \u{2014} difahami. Keputusan yang datang melalui kawan dan media sosial ialah pintu masuk penipuan era AI. Kita akan berlatih untuk itu.`,evidence:(e,t)=>`"${t}" \u{2014} berasaskan bukti. Bagus. Persoalannya, adakah disiplin itu bertahan di bawah tekanan? Kita akan lihat.`,mixed:(e,t)=>`"${t}" \u{2014} difahami. Saya dengar naluri lebih daripada kaedah. Itu boleh dilatih.`,sell:(e,t)=>`"${t}" \u{2014} jujur. Naluri menjual ketika takut ialah 'loss aversion', dan ramai yang begitu. Menyedarinya langkah pertama; melatihnya langkah kedua.`,plan:(e,t)=>`"${t}" \u{2014} rancangan dahulu, tindakan kemudian. Itu jawapan paling kuat. Mari lihat sama ada ia bertahan apabila tekanan menjadi peribadi.`,dip:(e,t)=>`"${t}" \u{2014} membeli ketika takut boleh jadi betul, tetapi saya tidak dengar rangka risiko. Kita akan usahakan.`,unclear:(e,t)=>`"${t}" \u{2014} baiklah. Jawapan sebenar anda akan muncul dalam latihan, bukan dalam kata-kata. Sebab itulah kita berlatih.`},obs:{pre:"Pra-pelabur. Tetingkap pembelajaran tinggi — tabiat belum terbentuk.",trader:"Pedagang aktif. Risiko keyakinan berlebihan ditanda untuk laluan latihan.",selfTaught:"Pengalaman belajar sendiri. Ada pendedahan taktikal, tiada rangka strategik dikesan.",aiTrust:"Kepercayaan AI tanpa kritis. Literasi alat AI ialah dimensi keutamaan.",social:"Keputusan dipengaruhi sosial. Pengesahan bebas rendah. Risiko pendedahan vektor penipuan.",evidence:"Penaakulan berasaskan bukti hadir. Sahkan kedalamannya di bawah tekanan.",mixed:"Input keputusan bercampur. Aliran kerja pengesahan belum tersusun.",sell:"Loss aversion ketara. Tindak balas emosi di bawah tekanan simulasi adalah tinggi.",plan:"Isyarat disiplin berasaskan rancangan. Tindak balas volatiliti paling kuat.",dip:"Naluri kontrarian tanpa rangka risiko. Keyakinan belum disahkan.",unclear:"Tindak balas volatiliti tidak jelas — corak emosi akan diperhati dalam latihan."},sig:{vuln:"Isyarat kerentanan penipuan",cert:"Isyarat pensijilan",verif:"Isyarat pengesahan",neutral:"Penglibatan neutral",trust:"Bias pemindahan kepercayaan",socialProof:"Tunduk kepada bukti sosial",urgency:"Tunduk kepada desakan",resist:"Ketahanan tekanan",resistPart:"Ketahanan tekanan — separa"},ana:{vuln0:"Persetujuan serta-merta tanpa pengesahan — corak yang menjadi sandaran penipuan rekrutmen.",cert0:"Bertanya pendaftaran dahulu sebelum sebarang penglibatan — penapis penipuan paling berkesan untuk pelabur runcit.",verif0:"Keraguan sebelum penglibatan — identiti atau dakwaan pulangan dicabar. Langkah pertama yang betul.",neutral0:"Tiada komitmen dibuat — tetapi tiada soalan pengesahan diajukan lagi. Soalan pendaftaran ialah langkah paling kuat di sini.",trust1:"“Penipuan melalui perekrut sengaja mengeksploitasi kenalan yang dipercayai — rakan yang berkongsi skim itu sering kali mangsa yang dijadikan saluran pengedaran.”",social1:"Tangkapan skrin palsu dan 'semua orang dah masuk' cukup untuk menggerakkan anda. Tangkapan skrin keuntungan bukan bukti.",cert1:"Cabaran pendaftaran terus di bawah bukti sosial — tingkah laku yang AUREN sijilkan.",verif1:"Keraguan terhadap bukti di bawah tekanan sosial. Naluri pengesahan sedang terbentuk.",urgency2:"Wang dikomit dalam tarikh akhir buatan tanpa sa "Saya akan sahkan di luar talian dulu sebelum buat apa-apa"],ready:["Saya sedia","Jom mula"]}},es:{ttsLang:"es-ES",dims:{IR:"Razonamiento Inversor",AL:"Alfabetización en IA",RA:"Conciencia del Riesgo",SR:"Resistencia al Fraude",BS:"Estabilidad Conductual"},ui:{liveSession:"sesión en directo",notAdvice:"No es asesoramiento",speaking:"AUREN · hablando",listening:"AUREN · escuchando",tapToSkip:"toca para saltar",send:"Enviar",orTry:"o prueba:",observed:"observado",introTitle:"Una sesión en directo: entrevista → perfil de preparación (AIRS) → ensayo de rol → informe con evidencias.",introSub:"Ella permanece flotando arriba — la conversación se desplaza aquí, debajo de ella.",phName:"Dile tu nombre a AUREN…",phAnswer:"Responde a AUREN con tus propias palabras…",phReady:'Di "listo" cuando quieras…',phMarcus:"Responde a Marcus…",phDone:"Sesión completada — reinicia abajo",phAurenSpeaking:"AUREN está hablando…",phMarcusSpeaking:"Marcus está hablando…",ailsTitle:"AIRS · preparación inicial",ailsNote:"La Puntuación de Preparación Inversora AUREN — generada a partir de tu conversación. “No una foto fija, una trayectoria.”",roleplaySys:"Rol conectado · “Marcus” · persona de IA · ensayo seguro",roleplayAgainSys:"Rol reiniciado con variaciones · no puedes aprobar memorizando un guion",personaTag:"persona de IA · simulado · ensayo seguro",personaName:'"Marcus"',personaRole:"Grupo Privado de Trading",watching:"AUREN · observando",improvement:"Mejora",feedback:"Feedback",scTitle:"Informe con evidencias",scOwnWords:"Tus propias palabras, evaluadas.",before:"antes",now:"ahora",session:"esta sesión",exchange:"Intercambio",evidenceQuote:"“Se le muestran sus propias palabras... La evidencia es la transcripción. Nada se afirma sin poder señalarlo.” — Documento Completo del Proyecto §13",regSees:"Lo que ve el regulador",regBody:e=>`Un dato anonimizado: cohorte ES \xb7 \u{201C}reclutamiento por WhatsApp\u{201D} \xb7 ${e}. A escala de poblaci\xf3n: \u{201C}una red de sensores de alerta tempr
